<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="randomNum()" >Generate Random Number</button>
</body>
<script>
    function randomNum(){
        var num1 = prompt('Enter the number 1:');
        var num2 = prompt('Enter the number 2:');

        num1=Number(num1);
        num2=parseInt(num2);
        console.log(Math.floor(Math.random()*(Math.max(num1,num2) - Math.min(num1,num2) +1)) + Math.min(num1,num2))
    }
</script>
</html>
